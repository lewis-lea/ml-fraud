[project]
name = "ml-fraud"
version = "0.1.0"
description = "Analysis of SynSEPA dataset - primarily for ML monitoring."
readme = "README.md"
authors = [
    { email = "lewis.lea@cantab.net" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.5",
    "pandas>=3.0.6",
    "pathlib>=1.0.1",
]

[project.scripts]
ml-fraud = "ml_fraud:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "requests>=2.34.2",
]
